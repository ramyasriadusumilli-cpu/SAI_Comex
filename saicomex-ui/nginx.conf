# Container-level nginx: serves the SPA and proxies /api to the API container
# over the internal docker network. The host-level nginx in front of this one
# terminates TLS and does nothing else — see deploy/nginx/.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        # Settlement calculation over a long period can be slow on a large
        # shaft; 120s is generous but well short of an operator giving up.
        proxy_read_timeout 120s;
    }

    # Hashed bundles are immutable; index.html must never be cached, or an
    # operator keeps running yesterday's build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
