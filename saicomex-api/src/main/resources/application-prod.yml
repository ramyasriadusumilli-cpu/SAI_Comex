# Production profile.
#
# Deliberately NO `${VAR:default}` fallbacks on anything that decides which
# database or object store the application talks to. A defaulted variable
# lets the container boot happily against the wrong backend — the failure
# mode the fleet system spent four weeks not noticing. Bare `${VAR}` fails
# fast at startup instead.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Flyway runs on every start and applies pending migrations. Deploying a
    # jar that contains a new migration WILL apply it to production on
    # restart — there is no manual gate. See docs/DEPLOYMENT.md.
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLE:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

server:
  port: 8080

springdoc:
  swagger-ui:
    # Swagger UI is off in production by default. Turn it on deliberately and
    # temporarily; the schema it publishes is a map of every endpoint.
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: saicomex

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  reporting-currency: ${REPORTING_CURRENCY:USD}
  storage:
    # MINIO_ENDPOINT must be the PUBLIC https URL, not a docker-internal
    # hostname: presigned URLs are opened by the operator's browser, which
    # cannot resolve `minio`. This is the single most common way to break
    # every upload, view and delete at once.
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    presign-expiry-minutes: 60
    enabled: true
  mail:
    from: ${MAIL_FROM:noreply@saicomex.com}
    reset-url: ${RESET_URL}
    admin-email: ${ADMIN_EMAIL}

logging:
  level:
    com.saicomex: INFO
    org.hibernate.SQL: WARN
