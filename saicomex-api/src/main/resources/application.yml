server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: saicomex-api
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saicomex}
    username: ${DB_USER:comex_admin}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never touch DDL — a stray
      # ddl-auto on a financial database is an unrecoverable afternoon.
      ddl-auto: none
    open-in-view: false
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: saicomex
  health:
    mail:
      enabled: false

info:
  app:
    name: SAIComex Mining Platform
    description: Integrated mining operations, production, financial and asset management
    version: 1.0.0

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4300}
  jwt:
    secret: ${JWT_SECRET:local-development-only-secret-not-for-production-use-32}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Group reporting currency. Every stored base_amount is expressed in this
  # currency; changing it after transactions exist does NOT retranslate
  # history — see docs/STABILITY_RULES.md before touching it.
  reporting-currency: ${REPORTING_CURRENCY:USD}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9200}
    access-key: ${MINIO_ACCESS_KEY:comexadmin}
    secret-key: ${MINIO_SECRET_KEY:comexpassword123}
    bucket: ${MINIO_BUCKET:comex-files}
    presign-expiry-minutes: 60
    enabled: ${STORAGE_ENABLED:true}
  mail:
    from: ${MAIL_FROM:noreply@saicomex.com}
    reset-url: ${RESET_URL:http://localhost:4300/reset-password}
    admin-email: ${ADMIN_EMAIL:admin@saicomex.com}
  alerts:
    # Nightly alert evaluation (SRS §31). Thresholds themselves live in
    # alert_rules / system_config, not here.
    enabled: ${ALERTS_ENABLED:true}
    cron: ${ALERTS_CRON:0 15 2 * * *}
  demo-data:
    # DemoDataLoader — seeds a small realistic dataset on a fresh install
    # (empty of projects) so the dashboard is not empty. Never runs against
    # a database that already has project data, regardless of this flag.
    enabled: ${DEMO_DATA_ENABLED:false}

logging:
  level:
    com.saicomex: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
