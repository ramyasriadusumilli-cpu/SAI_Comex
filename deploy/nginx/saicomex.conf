# Host-level nginx site for the SAIComex platform.
#
# Install as /etc/nginx/sites-available/saicomex.conf and symlink into
# sites-enabled. This sits IN FRONT of the container nginx: it terminates TLS
# and proxies to the localhost-bound container ports. It does not serve files.
#
# The fleet system's site file (saifleet-internal.conf) is untouched by this;
# the two coexist because they answer on different server_names.

server {
    listen 80;
    listen [::]:80;
    server_name comex.saifleet.co.za;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name comex.saifleet.co.za;

    ssl_certificate     /etc/letsencrypt/live/comex.saifleet.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comex.saifleet.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "DENY"           always;
    add_header X-Content-Type-Options     "nosniff"        always;
    add_header Referrer-Policy            "no-referrer"    always;
    add_header X-Robots-Tag               "noindex, nofollow" always;

    # Document uploads and photos; the API's presigned URLs point here.
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    access_log /var/log/nginx/saicomex-access.log;
    error_log  /var/log/nginx/saicomex-error.log;

    # ---- API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ---- MinIO object storage --------------------------------------------
    # The bucket name is part of the public path, so renaming the bucket means
    # editing this location block too.
    location /comex-files/ {
        proxy_pass http://127.0.0.1:9200/comex-files/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 30m;
    }

    # ---- Actuator: localhost only ----------------------------------------
    # /actuator/prometheus exposes internal metrics and /actuator/health leaks
    # dependency state; neither belongs on the public internet.
    location /actuator/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8090/actuator/;
    }

    # ---- SPA -------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:8091/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
