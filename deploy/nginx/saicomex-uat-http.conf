# TEMPORARY plain-HTTP access to SAIComex UAT by hostname (pre-DNS), for use before the
# real DNS record + TLS are in place. Matches ONLY the server's IP as the
# Host, so it never becomes the default server and leaves the fleet sites
# (internal.saifleet.co.za / uat.saifleet.co.za) untouched.
#
#   http://89.167.106.195/   ->  comex-frontend (127.0.0.1:8093) + /api -> 8090
#
# REMOVE THIS once https://uat.saicomex.saigroup.co.za is serving over TLS — a
# financial app's login should not stay reachable over plain HTTP. Disable with:
#   rm /etc/nginx/sites-enabled/saicomex-ip.conf && nginx -t && systemctl reload nginx
#
# NOTE: document/photo (MinIO presigned) links point at the future HTTPS domain,
# so attachments won't open over this IP path until DNS+TLS are live. Login and
# every normal screen work fine.

server {
    listen 80;
    listen [::]:80;
    server_name uat.saicomex.saigroup.co.za;

    client_max_body_size 30m;

    access_log /var/log/nginx/saicomex-uat-http-access.log;
    error_log  /var/log/nginx/saicomex-uat-http-error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8092/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /comex-files/ {
        proxy_pass http://127.0.0.1:9202/comex-files/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        client_max_body_size 30m;
    }

    location / {
        proxy_pass http://127.0.0.1:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
